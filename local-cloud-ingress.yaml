apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: local-cloud-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: local-cloud.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: flask-service
            port:
              number: 5000

